<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALESPINA Automotores PRO</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}
header{
  background:#0d0d0d;
  border-bottom:1px solid #292929;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:20;
}
.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:22px;
  font-weight:900;
}
.logo span{color:#e00000}
.admin{
  color:#fff;
  text-decoration:none;
  border:1px solid #e00000;
  padding:10px 16px;
  border-radius:8px;
}
.hero{
  padding:65px 5%;
  background:linear-gradient(135deg,#080808,#170000);
  text-align:center;
}
.hero h1{
  font-size:clamp(32px,6vw,64px);
  margin-bottom:15px;
}
.hero h1 span{color:#e00000}
.hero p{
  color:#aaa;
  font-size:18px;
}
.stats{
  max-width:1100px;
  margin:-30px auto 40px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  position:relative;
}
.stat{
  background:#121212;
  border:1px solid #292929;
  border-radius:14px;
  padding:22px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:30px;
  color:#e00000;
}
.stat span{color:#999}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  margin-bottom:30px;
}
input,select{
  width:100%;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  padding:14px;
  outline:none;
}
input:focus,select:focus{border-color:#e00000}
#estado{
  text-align:center;
  padding:30px;
  color:#aaa;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  overflow:hidden;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#e00000;
}
.card-img{
  height:220px;
  background:#181818;
  position:relative;
}
.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.badge{
  position:absolute;
  top:12px;
  left:12px;
  background:#e00000;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}
.card-body{padding:18px}
.card h2{
  font-size:21px;
  margin-bottom:8px;
}
.info{
  color:#999;
  font-size:14px;
  margin-bottom:12px;
}
.price{
  color:#fff;
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
}
.buttons{
  display:flex;
  gap:8px;
}
button{
  border:0;
  cursor:pointer;
  border-radius:8px;
  padding:11px;
  font-weight:bold;
}
.view{
  background:#e00000;
  color:#fff;
  flex:1;
}
.share{
  background:#292929;
  color:#fff;
}
.favorite{
  background:#292929;
  color:#fff;
}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#888;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:100;
  padding:20px;
  overflow:auto;
}
.modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-box{
  width:min(900px,100%);
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  overflow:hidden;
}
.modal-img{
  width:100%;
  max-height:480px;
  object-fit:cover;
}
.modal-content{padding:25px}
.close{
  float:right;
  background:#333;
  color:#fff;
}
.whatsapp{
  display:block;
  text-align:center;
  background:#159447;
  color:#fff;
  padding:14px;
  border-radius:8px;
  text-decoration:none;
  margin-top:20px;
  font-weight:bold;
}
footer{
  margin-top:70px;
  padding:30px;
  text-align:center;
  color:#666;
  border-top:1px solid #222;
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr}
}
@media(max-width:550px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .nav{flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">MALESPINA <span>AUTOMOTORES PRO</span></div>
    <a class="admin" href="admin.html">ADMIN PRO</a>
  </div>
</header>

<section class="hero">
  <h1>Encontrá tu próximo <span>vehículo</span></h1>
  <p>MALESPINA Automotores · Catálogo PRO</p>
</section>

<section class="stats">
  <div class="stat">
    <strong id="total">0</strong>
    <span>Vehículos</span>
  </div>
  <div class="stat">
    <strong id="destacados">0</strong>
    <span>Destacados</span>
  </div>
  <div class="stat">
    <strong id="ofertas">0</strong>
    <span>Ofertas</span>
  </div>
</section>

<main class="container">

  <div class="filters">
    <input
      id="busqueda"
      type="text"
      placeholder="Buscar marca, modelo..."
    >

    <select id="marca">
      <option value="">Todas las marcas</option>
    </select>

    <select id="orden">
      <option value="nuevo">Más nuevos</option>
      <option value="precioMenor">Precio menor</option>
      <option value="precioMayor">Precio mayor</option>
    </select>
  </div>

  <div id="estado">Cargando vehículos...</div>

  <div id="listaAutos" class="grid"></div>

</main>

<div id="modal" class="modal">
  <div class="modal-box">
    <img id="modalImg" class="modal-img" src="" alt="">
    <div class="modal-content">
      <button class="close" onclick="cerrarModal()">Cerrar</button>
      <h2 id="modalTitulo"></h2>
      <p id="modalInfo" class="info"></p>
      <div id="modalPrecio" class="price"></div>
      <p id="modalDescripcion" class="info"></p>

      <a
        id="modalWhatsapp"
        class="whatsapp"
        target="_blank"
        href="#"
      >
        Consultar por WhatsApp
      </a>
    </div>
  </div>
</div>

<footer>
  MALESPINA Automotores · Salta
</footer>

<script>
const SUPABASE_URL =
"https://mbrcbeqbtllajgcqujxv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-j0aKO6FadT11STSQ7w0jg_1YP-dtTS";

/* IMPORTANTE:
   PRO usa EXCLUSIVAMENTE esta tabla */
const TABLA = "vehiculos_pro";

const WHATSAPP = "543878636763";

let vehiculos = [];
let filtrados = [];

async function cargarVehiculos(){

  const estado = document.getElementById("estado");

  estado.textContent = "Cargando vehículos...";

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      TABLA +
      "?select=*&order=id.desc";

    const respuesta = await fetch(url,{
      method:"GET",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json"
      }
    });

    const texto = await respuesta.text();

    if(!respuesta.ok){
      throw new Error(texto);
    }

    vehiculos = JSON.parse(texto);

    filtrados = [...vehiculos];

    actualizarEstadisticas();
    cargarMarcas();
    mostrarVehiculos();

  }catch(error){

    console.error("ERROR PRO:",error);

    estado.innerHTML = `
      <div style="color:#e00000;font-weight:bold">
        No se pudieron cargar los vehículos.
      </div>
      <div style="margin-top:10px;font-size:13px;color:#777">
        Error de conexión con vehiculos_pro.
      </div>
    `;
  }
}

function actualizarEstadisticas(){

  document.getElementById("total").textContent =
    vehiculos.filter(v => !v.vendido).length;

  document.getElementById("destacados").textContent =
    vehiculos.filter(v => v.destacado && !v.vendido).length;

  document.getElementById("ofertas").textContent =
    vehiculos.filter(v => v.oferta && !v.vendido).length;
}

function cargarMarcas(){

  const select = document.getElementById("marca");

  const marcas = [
    ...new Set(
      vehiculos
        .map(v => v.marca)
        .filter(Boolean)
    )
  ].sort();

  select.innerHTML =
    `<option value="">Todas las marcas</option>`;

  marcas.forEach(marca => {

    const option = document.createElement("option");

    option.value = marca;
    option.textContent = marca;

    select.appendChild(option);
  });
}

function aplicarFiltros(){

  const texto =
    document
      .getElementById("busqueda")
      .value
      .toLowerCase()
      .trim();

  const marca =
    document.getElementById("marca").value;

  const orden =
    document.getElementById("orden").value;

  filtrados = vehiculos.filter(v => {

    if(v.vendido) return false;

    const contenido = `
      ${v.marca || ""}
      ${v.modelo || ""}
      ${v.descripcion || ""}
    `.toLowerCase();

    const coincideTexto =
      !texto || contenido.includes(texto);

    const coincideMarca =
      !marca || v.marca === marca;

    return coincideTexto && coincideMarca;
  });

  if(orden === "precioMenor"){
    filtrados.sort((a,b)=>
      Number(a.precio || 0) -
      Number(b.precio || 0)
    );
  }

  if(orden === "precioMayor"){
    filtrados.sort((a,b)=>
      Number(b.precio || 0) -
      Number(a.precio || 0)
    );
  }

  mostrarVehiculos();
}

function mostrarVehiculos(){

  const contenedor =
    document.getElementById("listaAutos");

  const estado =
    document.getElementById("estado");

  estado.textContent = "";

  contenedor.innerHTML = "";

  if(!filtrados.length){

    contenedor.innerHTML = `
      <div class="empty">
        <h2>No hay vehículos disponibles</h2>
        <p>Probá cambiando los filtros.</p>
      </div>
    `;

    return;
  }

  filtrados.forEach(auto => {

    const imagen = obtenerImagen(auto);

    const precio =
      auto.precio
      ? "$ " + Number(auto.precio).toLocaleString("es-AR")
      : "Consultar";

    const destacado =
      auto.destacado
      ? `<div class="badge">DESTACADO</div>`
      : "";

    const card = document.createElement("article");

    card.className = "card";

    card.innerHTML = `
      <div class="card-img">
        <img
          src="${imagen}"
          alt="${esc(auto.marca)} ${esc(auto.modelo)}"
          onerror="this.src='https://via.placeholder.com/800x500?text=MALESPINA+AUTOMOTORES'"
        >
        ${destacado}
      </div>

      <div class="card-body">

        <h2>
          ${esc(auto.marca || "")}
          ${esc(auto.modelo || "")}
        </h2>

        <div class="info">
          ${auto.anio || "Año no informado"}
          ·
          ${auto.kilometros
            ? Number(auto.kilometros).toLocaleString("es-AR") + " km"
            : "Km no informado"}
        </div>

        <div class="price">${precio}</div>

        <div class="buttons">

          <button
            class="view"
            onclick="abrirVehiculo(${auto.id})"
          >
            Ver vehículo
          </button>

          <button
            class="favorite"
            onclick="favorito(${auto.id})"
          >
            ♥
          </button>

          <button
            class="share"
            onclick="compartir(${auto.id})"
          >
            ↗
          </button>

        </div>

      </div>
    `;

    contenedor.appendChild(card);
  });
}

function obtenerImagen(auto){

  if(auto.imagen){
    return auto.imagen;
  }

  if(
    Array.isArray(auto.imagenes) &&
    auto.imagenes.length
  ){
    return auto.imagenes[0];
  }

  return "https://via.placeholder.com/800x500?text=MALESPINA+AUTOMOTORES";
}

function abrirVehiculo(id){

  const auto =
    vehiculos.find(v => Number(v.id) === Number(id));

  if(!auto) return;

  document.getElementById("modalImg").src =
    obtenerImagen(auto);

  document.getElementById("modalTitulo").textContent =
    `${auto.marca || ""} ${auto.modelo || ""}`;

  document.getElementById("modalInfo").textContent =
    `${auto.anio || ""} · ${
      auto.kilometros
      ? Number(auto.kilometros).toLocaleString("es-AR") + " km"
      : "Km no informado"
    }`;

  document.getElementById("modalPrecio").textContent =
    auto.precio
    ? "$ " + Number(auto.precio).toLocaleString("es-AR")
    : "Consultar precio";

  document.getElementById("modalDescripcion").textContent =
    auto.descripcion || "Consultanos para recibir más información.";

  const mensaje =
    encodeURIComponent(
      `Hola! Quiero consultar por el ${auto.marca || ""} ${auto.modelo || ""} ${auto.anio || ""}.`
    );

  document.getElementById("modalWhatsapp").href =
    `https://wa.me/${WHATSAPP}?text=${mensaje}`;

  document.getElementById("modal").classList.add("active");

  registrarEvento("visita",auto.id);
}

function cerrarModal(){
  document.getElementById("modal").classList.remove("active");
}

function favorito(id){

  let favoritos =
    JSON.parse(localStorage.getItem("malespina_favoritos") || "[]");

  if(favoritos.includes(id)){
    favoritos =
      favoritos.filter(x => x !== id);
  }else{
    favoritos.push(id);
    registrarEvento("favorito",id);
  }

  localStorage.setItem(
    "malespina_favoritos",
    JSON.stringify(favoritos)
  );
}

async function compartir(id){

  const auto =
    vehiculos.find(v => Number(v.id) === Number(id));

  if(!auto) return;

  const url =
    window.location.origin +
    window.location.pathname +
    "?vehiculo=" +
    auto.id;

  try{

    if(navigator.share){

      await navigator.share({
        title:`${auto.marca} ${auto.modelo}`,
        text:"Mirá este vehículo de MALESPINA Automotores",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(url);

      alert("Link copiado");

    }

    registrarEvento("compartido",id);

  }catch(e){}
}

async function registrarEvento(tipo,vehiculoId){

  try{

    await fetch(
      SUPABASE_URL +
      "/rest/v1/analytics_eventos",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          tipo:tipo,
          vehiculo_id:vehiculoId
        })
      }
    );

  }catch(e){

    console.log("Analytics:",e);

  }
}

function esc(valor){

  return String(valor)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document
  .getElementById("busqueda")
  .addEventListener("input",aplicarFiltros);

document
  .getElementById("marca")
  .addEventListener("change",aplicarFiltros);

document
  .getElementById("orden")
  .addEventListener("change",aplicarFiltros);

document
  .getElementById("modal")
  .addEventListener("click",function(e){

    if(e.target === this){
      cerrarModal();
    }

  });

cargarVehiculos();

registrarEvento("visita",null);

</script>

</body>
</html>
